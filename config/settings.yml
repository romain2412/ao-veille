# --- Seuil de pertinence ---
scoring:
  min_score: 20                # score minimum pour qu'un AO soit conservé

# --- Types de marchés retenus ---
market_types:
  - "TRAVAUX"
  - "SERVICES"

# --- Natures d'avis retenus ---
notice_natures:
  - "APPEL_OFFRE"
  - "MARCHE_SIMPLIF"
  - "MARCHE_NEGOC"

# --- Notifications mail ---
notifications:
  enabled: false
  frequency_hours: 24
  smtp_host: "smtp.example.com"
  smtp_port: 587
  smtp_user: ""
  smtp_password: ""
  from_address: "veille@fb-vrd.fr"
  recipients:
    - "contact@fb-vrd.fr"
